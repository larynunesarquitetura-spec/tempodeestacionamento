
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Parquímetro Digital</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="container">

        <section class="parquimetro">

            <h1>Parquímetro Digital</h1>

            <p>
                Informe o valor para calcular
                seu tempo de estacionamento.
            </p>

            <form id="parkingForm">

                <label for="valor">
                    Valor do pagamento (R$)
                </label>

                <input
                    type="number"
                    id="valor"
                    placeholder="Ex: 5.00"
                    min="0"
                    step="0.01"
                    required
                >

                <button type="submit">
                    Calcular estacionamento
                </button>

            </form>

            <div id="resultado" class="resultado" aria-live="polite">
                <p>O resultado aparecerá aqui.</p>
            </div>

        </section>

    </main>

    <script src="scripts.js"></script>

</body>
</html>
